{% extends "base.html" %}

{% block content %}
<h2>Radio Detections and Non-Detections of Gamma-Ray Bursts from AMI-LA</h2>


<form method="GET" class="filter-box">
    <div>
        <label>Detection type</label>
        <select name="type">
            <option value="all" {% if selected_type == "all" %}selected{% endif %}>All</option>
            <option value="Detection" {% if selected_type == "Detection" %}selected{% endif %}>Detections only</option>
            <option value="Non-Detection" {% if selected_type == "Non-Detection" %}selected{% endif %}>Non-detections only</option>
        </select>
    </div>

    <div>
        <label>Redshift</label>
        <select name="redshift">
            <option value="all" {% if selected_redshift == "all" %}selected{% endif %}>All</option>
            <option value="known" {% if selected_redshift == "known" %}selected{% endif %}>Known only</option>
            <option value="unknown" {% if selected_redshift == "unknown" %}selected{% endif %}>Unknown only</option>
        </select>
    </div>


     <div>
        <label>Year</label>
        <select name="year">
            <option value="all" {% if selected_year == "all" %}selected{% endif %}>All</option>
            <option value="2012" {% if selected_year == "2014" %}selected{% endif %}>2012</option>
            <option value="2013" {% if selected_year == "2014" %}selected{% endif %}>2013</option>
            <option value="2014" {% if selected_year == "2014" %}selected{% endif %}>2014</option>
            <option value="2015" {% if selected_year == "2015" %}selected{% endif %}>2015</option>
            <option value="2016" {% if selected_year == "2016" %}selected{% endif %}>2016</option>
            <option value="2017" {% if selected_year == "2017" %}selected{% endif %}>2017</option>
            <option value="2018" {% if selected_year == "2018" %}selected{% endif %}>2018</option>
            <option value="2019" {% if selected_year == "2019" %}selected{% endif %}>2019</option>
            <option value="2020" {% if selected_year == "2020" %}selected{% endif %}>2020</option>
            <option value="2021" {% if selected_year == "2021" %}selected{% endif %}>2021</option>
            <option value="2022" {% if selected_year == "2022" %}selected{% endif %}>2022</option>
            <option value="2023" {% if selected_year == "2023" %}selected{% endif %}>2023</option>
            <option value="2024" {% if selected_year == "2024" %}selected{% endif %}>2024</option>
            <option value="2025" {% if selected_year == "2025" %}selected{% endif %}>2025</option>
        </select>
    </div>


      <div>
        <label>In paper</label>
        <select name="paper">
            <option value="all" {% if selected_inpaper == "all" %}selected{% endif %}>All</option>
            <option value="TRUE" {% if selected_inpaper == "TRUE" %}selected{% endif %}>Analyzed in Paper</option>
            <option value="FALSE" {% if selected_inpaper == "FALSE" %}selected{% endif %}>Not Analyzed in Paper</option>
        </select>
    </div>

    <button type="submit">Update plot</button>
</form>
<div>
    {{ plot_html | safe }}
</div>
{% endblock %}
